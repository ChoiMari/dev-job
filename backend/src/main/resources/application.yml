spring:
  ai:
    openai:
      base-url: ${AI_BASE_URL:https://copa.codyssey.kr}
      api-key: ${OPENAI_API_KEY:disabled}
      chat:
        options:
          model: gpt-5.4-mini
          max-completion-tokens: 500
    retry:
      max-attempts: 1
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: devjob-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:devjob}
    username: ${DB_USERNAME:devjob}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
logging:
  level:
    org.springframework.ai.retry: OFF
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
        path: /
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
