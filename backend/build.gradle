plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.devjob'
version = '0.0.1-SNAPSHOT'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

repositories { mavenCentral() }

dependencyManagement {
    imports { mavenBom 'org.springframework.ai:spring-ai-bom:1.1.8' }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }

tasks.register('dbTest', Test) {
    description = 'Starts the application and verifies a real PostgreSQL connection.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'database' }
    shouldRunAfter tasks.named('test')
}

tasks.named('test') { useJUnitPlatform { excludeTags 'database', 'work24-live', 'ai-live' } }

tasks.register('work24LiveTest', Test) {
    description = 'Explicit opt-in Work24 open recruitment smoke test; no database writes.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'work24-live' }
    doFirst {
        if (System.getenv('WORK24_LIVE_TEST') != 'true'
                || !System.getenv('WORK24_AUTH_KEY')?.trim()) {
            throw new GradleException('Set WORK24_LIVE_TEST=true and inject WORK24_AUTH_KEY in the process environment.')
        }
    }
    // Deliberate invocation should issue a fresh request, without putting secrets in task inputs.
    outputs.upToDateWhen { false }
}

tasks.register('aiLiveTest', Test) {
    description = 'Explicit opt-in single OpenAI analysis request against the isolated S12 database.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'ai-live' }
    doFirst {
        if (System.getenv('AI_LIVE_TEST') != 'true' || !System.getenv('OPENAI_API_KEY')?.trim()
                || System.getenv('DB_NAME') != 'devjob_s12_test') {
            throw new GradleException('Set AI_LIVE_TEST=true, OPENAI_API_KEY and DB_NAME=devjob_s12_test.')
        }
    }
    outputs.upToDateWhen { false }
}
